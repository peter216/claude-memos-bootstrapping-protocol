        convention; update Memo Lifecycle with index update step
      release_summary: 'This release introduces a major update to the claude-memos
        tool, enhancing its functionality and improving the bootstrapping protocol
        for memo management. Key features include new command-line flags for better
        memo handling, a revised repository structure, and an updated memo lifecycle
