    changes:
      major_changes:
      - Co-Authored-By - Claude Sonnet 4.6 <noreply@anthropic.com>
      - Mid-Session Memo Loading - At any point during a session, Peter may request
        additional memos by id, tag, alias, or name.
      - bin/claude-memos - add --recent, --tags, --alias, --all, --memos, --list flags;
        inject Memo Loading Directive into system prompt; add MEMO_REPO_PATH and TAXONOMY_FILE
        env vars; fix --help reference from cpeer to claude-memos
      - bootstrap instructions (claude-memos-bootstrap.instructions.md via symlink)
        - bump to v1.0.0; rewrite Step 3 for index-based loading with taxonomy resolution
